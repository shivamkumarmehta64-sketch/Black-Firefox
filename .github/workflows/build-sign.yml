name: Build and Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Black Browser (x64)
        shell: cmd
        run: ci-build.bat

      - name: Upload artifact for SignPath signing
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: BlackBrowser-unsigned
          path: Black.exe

      - name: Check SignPath Secrets Availability
        id: signpath_check
        shell: pwsh
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          PROJ_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          POL_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $has = (-not [string]::IsNullOrWhiteSpace($env:API_TOKEN)) -and (-not [string]::IsNullOrWhiteSpace($env:ORG_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:PROJ_SLUG)) -and (-not [string]::IsNullOrWhiteSpace($env:POL_SLUG))
          "enabled=$($has.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign with SignPath.io
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed

      - name: Upload signed binary
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlackBrowser-signed
          path: ./signed/*.exe
