<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<meta name="description" content="A special surprise website">
<link rel="icon" type="image/png" href="assets/black.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;600;700;900&display=swap');

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}
html,body{background-color:#f5e6e8;width:100%;min-height:100%;font-family:Quicksand,sans-serif;overflow-x:hidden}
body{-webkit-user-select:none;user-select:none}

.birthday-container{justify-content:center;align-items:center;width:100vw;min-height:100dvh;display:flex;position:relative;overflow:hidden}
.soft-pink-bg{z-index:0;background:radial-gradient(at 20% 80%,#ffabcd 0%,#0000 45%),radial-gradient(at 90% 15%,#ffd3a7 0%,#0000 45%),radial-gradient(at 85% 90%,#d8acff 0%,#0000 45%),linear-gradient(135deg,#fde4f0 0%,#f5e6e8 40%,#f0dce8 60%,#fde8d0 100%);position:fixed;inset:0;overflow:hidden}
.floating-heart{color:#ff537b45;pointer-events:none;z-index:1;animation:ease-in-out infinite alternate floatHeart;position:fixed}
.heart-1{font-size:48px;animation-duration:14s;top:8%;left:4%}
.heart-2{font-size:22px;animation-duration:10s;top:25%;left:12%}
.heart-3{font-size:28px;animation-duration:13s;bottom:18%;right:18%}
.heart-4{font-size:24px;animation-duration:12s;top:12%;right:10%}
.heart-5{font-size:34px;animation-duration:16s;bottom:8%;right:4%}
.heart-6{font-size:20px;animation-duration:11s;top:45%;right:85%}
.heart-7{font-size:32px;animation-duration:15s;bottom:40%;left:80%}
@keyframes floatHeart{0%{transform:translateY(0)}to{transform:translateY(-18px)}}

.main-stage{z-index:2;justify-content:center;align-items:center;width:100%;max-width:1100px;padding:20px;display:flex;position:relative}
.passcode-section.transparent-bg{-webkit-backdrop-filter:none!important;box-shadow:none!important;background:0 0!important;border:none!important}
.polaroid-card{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);backface-visibility:hidden;background:#ffffffeb;padding:24px 24px 30px;position:relative;transform:translateZ(0);box-shadow:18px 18px 40px #a5789138,-12px -12px 35px #ffffff73,0 35px 60px #91698226;border-radius:0!important}
.photo-wrapper{aspect-ratio:4/5;background-color:#f7e8ee;width:100%;position:relative;border-radius:0!important;overflow:visible!important}
.tilted-emoji{object-fit:contain;z-index:50;filter:drop-shadow(0 8px 20px #00000040);pointer-events:none;width:200px;height:200px;position:absolute;top:-90px;left:-100px;transform:rotate(-40deg)translateZ(0)}
.photo-img{object-fit:cover;width:100%;height:100%;transform:translateZ(0);border-radius:0!important}
.birthday-title{text-align:center;color:#7c3a56;font-family:Cormorant Garamond,serif;font-weight:700}
.tap-hint{color:#a08090;text-align:center;margin-top:4px;font-size:12px;font-style:italic}
.passcode-title{color:#563343;margin-top:0;margin-bottom:18px;font-family:Cormorant Garamond,serif;font-size:32px;font-weight:700}
.dots-container{gap:12px;margin-bottom:20px;display:flex}
.dot-box{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#ff537b;background:#fff6;border:1px solid #fff9;border-radius:8px;justify-content:center;align-items:center;width:46px;height:46px;font-size:20px;font-weight:700;display:flex;box-shadow:inset 2px 2px 6px #9169821a}
.error-text{color:#d94b68;margin-bottom:10px;font-size:13px;font-weight:700;animation:.6s infinite alternate bounce}
@keyframes bounce{0%{transform:translateY(0)}to{transform:translateY(-4px)}}
.keypad-grid{grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:240px;display:grid}
.keypad-btn{color:#563343;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer;background:#ffffff4d;border:1px solid #fff9;border-radius:50%;justify-content:center;align-items:center;width:58px;height:58px;margin:0 auto;font-size:20px;font-weight:700;transition:all .2s;display:flex;box-shadow:0 4px 12px #9169821a}
.keypad-btn:hover{background:#fff9}
.keypad-btn:active{background:#fffc;transform:scale(.92)}
.delete-btn{color:#b05275;font-size:18px}
.unflip-btn{color:#7c3a56;cursor:pointer;background:0 0;border:none;margin-top:12px;font-size:13px;font-weight:700;text-decoration:underline}

/* celebration */
.celebration{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(135deg,#fde4f0 0%,#f5e6e8 40%,#f0dce8 60%,#fde8d0 100%)}
.celebration h1{font-family:Cormorant Garamond,serif;font-size:52px;font-weight:700;color:#7c3a56;line-height:1.1}
.celebration h1 span{display:inline-block}
.celebration p{color:#a08090;font-size:16px;max-width:420px;margin-top:14px;line-height:1.6}
.celebration .wish{color:#563343;font-family:Cormorant Garamond,serif;font-size:22px;font-weight:600;margin-top:22px}
.confetti{position:fixed;top:-20px;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.cake{font-size:90px;margin-bottom:8px;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

/* flip card: mobile */
@media (width<=767px){
  .main-stage{padding:10px;overflow:visible!important}
  .flip-card-container{perspective:1200px;width:300px;height:480px;overflow:visible!important}
  .flip-card-inner{text-align:center;width:100%;height:100%;transform-style:preserve-3d;will-change:transform;transition:transform .8s cubic-bezier(.34,1.2,.64,1);position:relative;overflow:visible!important}
  .flip-card-container.flipped .flip-card-inner{transform:rotateY(180deg)}
  .flip-card-front,.flip-card-back{backface-visibility:hidden;width:100%;height:100%;position:absolute;transform:translateZ(0);border-radius:0!important;overflow:visible!important}
  .polaroid-card{padding:16px 16px 20px}
  .tilted-emoji{width:150px;height:150px;top:-60px;left:-70px}
  .birthday-title{margin:12px 0 0;font-size:26px}
  .flip-card-back{flex-direction:column;justify-content:center;align-items:center;padding:10px;display:flex;transform:rotateY(180deg)translateZ(0)}
  .unflip-btn{display:block}
}

/* desktop: side by side */
@media (width>=768px){
  .flip-card-container,.flip-card-inner{perspective:none;flex-direction:row;justify-content:center;align-items:center;gap:70px;width:100%;display:flex;transform:none!important}
  .flip-card-front{cursor:default;backface-visibility:visible;width:420px;position:relative;transform:none!important}
  .flip-card-back{backface-visibility:visible;flex-direction:column;justify-content:center;align-items:center;width:330px;padding:10px;display:flex;position:relative;transform:none!important}
  .tap-hint,.unflip-btn{display:none!important}
}
</style>
</head>
<body>
<div class="birthday-container">
  <div class="soft-pink-bg"></div>
  <div class="floating-heart heart-1">♡</div>
  <div class="floating-heart heart-2">♥</div>
  <div class="floating-heart heart-3">♥</div>
  <div class="floating-heart heart-4">♡</div>
  <div class="floating-heart heart-5">♡</div>
  <div class="floating-heart heart-6">♥</div>
  <div class="floating-heart heart-7">♥</div>

  <!-- MAIN -->
  <div id="stage" class="main-stage">
    <div id="card" class="flip-card-container">
      <div class="flip-card-inner">

        <!-- FRONT: polaroid -->
        <div class="flip-card-front polaroid-card" id="cardFront">
          <div class="photo-wrapper">
            <span class="tilted-emoji">🎂</span>
            <img id="photo" src="https://api.dicebear.com/9.x/notionists/svg?seed=Birthday&backgroundColor=f7e8ee" alt="Birthday Girl" class="photo-img">
          </div>
          <p class="birthday-title">Happy Birthday!</p>
          <p class="tap-hint">✨ Tap card to enter passcode</p>
        </div>

        <!-- BACK: passcode -->
        <div class="flip-card-back passcode-section transparent-bg">
          <h2 class="passcode-title">Enter Passcode</h2>
          <div class="dots-container">
            <div class="dot-box" data-dot="0"></div>
            <div class="dot-box" data-dot="1"></div>
            <div class="dot-box" data-dot="2"></div>
            <div class="dot-box" data-dot="3"></div>
          </div>
          <p id="error" class="error-text" style="display:none">Wrong Passcode! Try again.</p>
          <div class="keypad-grid" id="keypad"></div>
          <button class="unflip-btn" id="unflipBtn">← Back to Photo</button>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- CELEBRATION -->
<div id="celebration" class="celebration" style="display:none">
  <div class="cake">🎂</div>
  <h1>Happy Birthday! <span>🎉</span></h1>
  <p id="msg">You unlocked the secret. Wishing you a day filled with love, laughter and everything sweet.</p>
  <p class="wish">— With love, always.</p>
</div>

<script>
(function(){
  var PASSCODE = "1234";
  var input = "";
  var flipped = false;
  var isMobile = window.innerWidth <= 767;

  var card = document.getElementById("card");
  var front = document.getElementById("cardFront");
  var dots = document.querySelectorAll(".dot-box");
  var errorEl = document.getElementById("error");
  var keypad = document.getElementById("keypad");
  var celebration = document.getElementById("celebration");
  var stage = document.getElementById("stage");

  function renderDots(){
    for (var i = 0; i < 4; i++){
      dots[i].textContent = input.length > i ? "♥" : "";
    }
  }

  function handleKey(k){
    if (k === "del"){
      input = input.slice(0, -1);
      errorEl.style.display = "none";
      renderDots();
      return;
    }
    if (input.length >= 4) return;
    input += k;
    errorEl.style.display = "none";
    renderDots();
    if (input.length === 4){
      if (input === PASSCODE){
        setTimeout(function(){ celebrate(); }, 250);
      } else {
        errorEl.style.display = "block";
        setTimeout(function(){ input = ""; errorEl.style.display = "none"; renderDots(); }, 1000);
      }
    }
  }

  function buildKeypad(){
    var keys = ["1","2","3","4","5","6","7","8","9","*","0","del"];
    keys.forEach(function(k){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "keypad-btn" + (k === "del" ? " delete-btn" : "");
      b.textContent = k === "del" ? "⌫" : k;
      b.onclick = function(){ handleKey(k); };
      keypad.appendChild(b);
    });
  }

  front.addEventListener("click", function(){
    if (!isMobile || flipped) return;
    card.classList.add("flipped");
    flipped = true;
  });

  document.getElementById("unflipBtn").addEventListener("click", function(){
    card.classList.remove("flipped");
    flipped = false;
  });

  window.addEventListener("resize", function(){
    isMobile = window.innerWidth <= 767;
  });

  function celebrate(){
    popSound();
    launchConfetti();
    card.style.display = "none";
    stage.style.display = "none";
    celebration.style.display = "flex";
  }

  // gentle confetti
  function launchConfetti(){
    var colors = ["#ff537b","#ffb3c6","#d8acff","#ffd3a7","#c9b7e8","#ff8fab"];
    var count = window.innerWidth < 600 ? 60 : 140;
    for (var i = 0; i < count; i++){
      var c = document.createElement("div");
      c.className = "confetti";
      var s = Math.random() * 10 + 6;
      c.style.left = Math.random() * 100 + "vw";
      c.style.width = s + "px";
      c.style.height = s * (Math.random() > 0.5 ? 0.5 : 1) + "px";
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      c.style.animationDuration = (Math.random() * 3 + 2.5) + "s";
      c.style.animationDelay = Math.random() * 1.5 + "s";
      c.style.opacity = Math.random() * 0.6 + 0.4;
      document.body.appendChild(c);
    }
    setTimeout(function(){
      document.querySelectorAll(".confetti").forEach(function(n){ n.remove(); });
    }, 9000);
  }

  // tiny pop using WebAudio (no external file)
  function popSound(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var seq = [523.25,659.25,783.99,1046.5];
      seq.forEach(function(f, i){
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "triangle";
        o.frequency.value = f;
        o.connect(g);
        g.connect(ctx.destination);
        var t = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.start(t);
        o.stop(t + 0.4);
      });
    }catch(e){}
  }

  buildKeypad();
  renderDots();
})();
</script>
</body>
</html>
